<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake</title>
<style>
  :root {
    --bg: #06060f;
    --neon: #35f0c8;
    --neon2: #ff3fb4;
    --food: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, #12122a 0%, var(--bg) 60%);
    color: #e8f7ff;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { display: grid; gap: 14px; justify-items: center; padding: 16px; }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 480px;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #7d8bb0;
  }
  .hud b { color: var(--neon); text-shadow: 0 0 12px var(--neon); }
  .stage { position: relative; width: min(90vw, 480px); aspect-ratio: 1; }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 16px;
    background: rgba(8, 10, 24, 0.85);
    box-shadow: 0 0 0 1px rgba(53, 240, 200, 0.25), 0 0 40px rgba(53, 240, 200, 0.12) inset, 0 20px 60px rgba(0, 0, 0, 0.6);
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    text-align: center;
    gap: 10px;
    border-radius: 16px;
    background: rgba(6, 6, 15, 0.78);
    backdrop-filter: blur(4px);
    transition: opacity 0.2s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h1 {
    margin: 0;
    font-size: clamp(24px, 6vw, 38px);
    letter-spacing: 4px;
    color: var(--neon);
    text-shadow: 0 0 18px var(--neon), 0 0 42px rgba(53, 240, 200, 0.5);
  }
  .overlay p { margin: 0; color: #93a1c7; font-size: 13px; line-height: 1.7; }
  .overlay .key { color: var(--neon2); }
  button {
    justify-self: center;
    margin-top: 6px;
    padding: 10px 22px;
    border: 1px solid var(--neon);
    border-radius: 999px;
    background: transparent;
    color: var(--neon);
    font: inherit;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
  }
  button:hover, button:focus-visible {
    background: var(--neon);
    color: #04110e;
    box-shadow: 0 0 24px var(--neon);
    outline: none;
  }
  .hint { color: #5b6787; font-size: 11px; letter-spacing: 1px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span>Счёт <b id="score">0</b></span>
    <span>Рекорд <b id="best">0</b></span>
  </div>
  <div class="stage">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h1>NEON SNAKE</h1>
      <p>
        <span class="key">← ↑ → ↓</span> или <span class="key">WASD</span> — движение<br>
        <span class="key">Space</span> — пауза · <span class="key">R</span> — заново
      </p>
      <button id="start">Играть</button>
    </div>
  </div>
  <div class="hint">Собери все ягоды. Не врежься в себя.</div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');

  const CELL = 24;
  const COLS = canvas.width / CELL;
  const ROWS = canvas.height / CELL;

  let snake, dir, nextDir, food, score, best, alive, paused, timer, blink;
  best = Number(localStorage.getItem('neon-snake-best') || 0);
  bestEl.textContent = best;

  const same = (a, b) => a.x === b.x && a.y === b.y;

  function spawnFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    food = free[Math.floor(Math.random() * free.length)] || { x: 0, y: 0 };
  }

  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    alive = true;
    paused = false;
    blink = 0;
    scoreEl.textContent = 0;
    spawnFood();
    draw();
  }

  function start() {
    reset();
    overlay.classList.add('hidden');
    clearInterval(timer);
    timer = setInterval(tick, 110);
  }

  function tick() {
    if (!alive || paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
    const hitSelf = snake.some((s, i) => i < snake.length - 1 && same(s, head));
    if (hitWall || hitSelf) return gameOver();

    snake.unshift(head);
    if (same(head, food)) {
      score++;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('neon-snake-best', best);
      }
      spawnFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    alive = false;
    clearInterval(timer);
    overlay.querySelector('h1').textContent = 'GAME OVER';
    overlay.querySelector('p').innerHTML = `Счёт: <span class="key">${score}</span> · Рекорд: <span class="key">${best}</span>`;
    startBtn.textContent = 'Ещё раз';
    overlay.classList.remove('hidden');
    draw();
  }

  function togglePause() {
    if (!alive) return;
    paused = !paused;
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(80, 110, 170, 0.10)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    if (food) {
      const pulse = 0.6 + 0.4 * Math.sin(Date.now() / 220);
      const cx = food.x * CELL + CELL / 2;
      const cy = food.y * CELL + CELL / 2;
      ctx.save();
      ctx.shadowColor = '#ffd166';
      ctx.shadowBlur = 24 * pulse;
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(cx, cy, CELL * 0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    snake.forEach((seg, i) => {
      const t = i / Math.max(snake.length - 1, 1);
      const hue = 165 + t * 40;
      const pad = i === 0 ? 1.5 : 3;
      const x = seg.x * CELL + pad;
      const y = seg.y * CELL + pad;
      const size = CELL - pad * 2;
      ctx.save();
      ctx.shadowColor = `hsl(${hue} 100% 60%)`;
      ctx.shadowBlur = i === 0 ? 22 : 10;
      ctx.fillStyle = `hsl(${hue} 95% ${i === 0 ? 70 : 55}%)`;
      roundRect(x, y, size, size, i === 0 ? 8 : 6);
      ctx.fill();
      ctx.restore();

      if (i === 0) {
        ctx.fillStyle = 'rgba(4, 17, 14, 0.85)';
        const ex = dir.x * 3;
        const ey = dir.y * 3;
        ctx.beginPath();
        ctx.arc(x + size * 0.32 + ex, y + size * 0.35 + ey, 2.2, 0, Math.PI * 2);
        ctx.arc(x + size * 0.68 + ex, y + size * 0.35 + ey, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    if (paused && alive) {
      ctx.fillStyle = 'rgba(6, 6, 15, 0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#35f0c8';
      ctx.shadowColor = '#35f0c8';
      ctx.shadowBlur = 24;
      ctx.font = 'bold 34px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('ПАУЗА', canvas.width / 2, canvas.height / 2);
      ctx.shadowBlur = 0;
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function queueDir(x, y) {
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
  }

  const keys = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
  };

  window.addEventListener('keydown', e => {
    if (keys[e.key]) {
      e.preventDefault();
      queueDir(...keys[e.key]);
    } else if (e.key === ' ') {
      e.preventDefault();
      togglePause();
    } else if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') {
      start();
    }
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) queueDir(dx > 0 ? 1 : -1, 0);
    else queueDir(0, dy > 0 ? 1 : -1);
    touchStart = null;
  }, { passive: true });

  startBtn.addEventListener('click', start);

  const raf = () => {
    if (alive && !paused && food) draw();
    requestAnimationFrame(raf);
  };
  requestAnimationFrame(raf);

  reset();
  overlay.querySelector('h1').textContent = 'NEON SNAKE';
})();
</script>
</body>
</html>
